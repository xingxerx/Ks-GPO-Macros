<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        body {
            font-family: 'Courier New', monospace;
            border-radius: 8px;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .StatsContainer {
            background: rgba(10, 10, 10, 0.9);
            color: #10b981;
            padding: 0.85em 1.25em;
            font-weight: 700;
            font-size: 1em;
            backdrop-filter: blur(10px);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .StatLine {
            margin-bottom: 0.4em;
            display: flex;
            justify-content: space-between;
            gap: 1.4em;
        }

        .StatLabel {
            color: #666;
        }

        .StatValue {
            color: #00d4ff;
            text-align: right;
        }

        .DevilFruitValue {
            color: #bf40bf;
            text-align: right;
        }

        .RarityLine {
            display: flex;
            justify-content: space-between;
            gap: 0.5em;
            margin-bottom: 0.4em;
            font-size: 0.85em;
        }

        .Rarity-Common { color: #9ca3af; }
        .Rarity-Rare { color: #3b82f6; }
        .Rarity-Epic { color: #a855f7; }
        .Rarity-Legendary { color: #f59e0b; }
        .Rarity-Mythical { color: #ef4444; }
        .Rarity-Unknown { color: #666; }

        .StatusLine {
            margin-top: 0.7em;
            padding-top: 0.7em;
            border-top: 1px solid rgba(100, 100, 100, 0.3);
        }

        .StatusLabel {
            color: #888;
            font-size: 0.78em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.28em;
        }

        .StatusValue {
            color: #10b981;
            font-size: 0.92em;
            animation: Pulse 2s ease-in-out infinite;
        }

        @keyframes Pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>
    <div class="StatsContainer">
        <div class="StatLine">
            <span class="StatLabel">Fish Caught</span>
            <span class="StatValue" id="FishCount">0</span>
        </div>
        <div class="StatLine">
            <span class="StatLabel">Devil Fruits</span>
            <span class="DevilFruitValue" id="DevilFruitCount">0</span>
        </div>
        <div class="RarityLine" title="Common / Rare / Epic / Legendary / Mythical">
            <span class="Rarity-Common">C <span id="RarityCommon">0</span></span>
            <span class="Rarity-Rare">R <span id="RarityRare">0</span></span>
            <span class="Rarity-Epic">E <span id="RarityEpic">0</span></span>
            <span class="Rarity-Legendary">L <span id="RarityLegendary">0</span></span>
            <span class="Rarity-Mythical">M <span id="RarityMythical">0</span></span>
        </div>
        <div class="StatLine">
            <span class="StatLabel">Last Fruit</span>
            <span class="StatValue" id="LastFruit">-</span>
        </div>
        <div class="StatLine">
            <span class="StatLabel">Time</span>
            <span class="StatValue" id="TimeElapsed">0:00:00</span>
        </div>
        <div class="StatLine">
            <span class="StatLabel">Fish/Hour</span>
            <span class="StatValue" id="FishPerHour">0.0</span>
        </div>
        <div class="StatusLine">
            <div class="StatusLabel">Current Status</div>
            <div class="StatusValue" id="CurrentStatus">Idle</div>
        </div>
    </div>

    <script>
        let StatsPort = 0;
        let pollTimer = null;

        function ApplyStatsPort(port) {
            if (!port || port <= 0) return;
            if (StatsPort === port) return;
            StatsPort = port;

            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(PollStats, 500);
            PollStats();
        }

        if (window.__TAURI__?.event?.listen) {
            window.__TAURI__.event.listen('backend-port-ready', (event) => {
                const port = event?.payload?.port;
                ApplyStatsPort(port);
            });
        }

        async function InitStatsPort() {
            const invoke = window.__TAURI__?.core?.invoke;
            if (invoke) {
                try {
                    const port = await invoke('get_backend_port');
                    if (port && port > 0) { ApplyStatsPort(port); return; }
                } catch (_) { }
            }

            if (window.__BACKEND_PORT__ && window.__BACKEND_PORT__ > 0) {
                ApplyStatsPort(window.__BACKEND_PORT__);
            }
        }

        async function PollStats() {
            if (!StatsPort) return;
            try {
                const Response = await fetch(`http://localhost:${StatsPort}/state`);
                const State = await Response.json();

                document.getElementById('FishCount').textContent = State.fishCaught || 0;
                document.getElementById('DevilFruitCount').textContent = State.devilFruitsCaught || 0;
                const ByRarity = State.devilFruitsByRarity || {};
                ['Common', 'Rare', 'Epic', 'Legendary', 'Mythical'].forEach(R => {
                    document.getElementById(`Rarity${R}`).textContent = ByRarity[R] || 0;
                });
                const Last = State.lastDevilFruit;
                const LastEl = document.getElementById('LastFruit');
                LastEl.textContent = Last ? Last.name : '-';
                LastEl.className = Last ? `Rarity-${Last.rarity}` : 'StatValue';
                document.getElementById('TimeElapsed').textContent = State.timeElapsed || '0:00:00';
                document.getElementById('FishPerHour').textContent = (State.fishPerHour || 0).toFixed(1);
                document.getElementById('CurrentStatus').textContent = State.currentStatus || 'Idle';
            } catch (Error) {
                console.error('Failed to poll stats:', Error);
            }
        }

        InitStatsPort();

        function ScaleToWindow() {
            const scale = Math.min(window.innerWidth / 200, window.innerHeight / 230);
            document.documentElement.style.fontSize = Math.max(7, Math.min(18, scale * 14)) + 'px';
        }

        ScaleToWindow();
        window.addEventListener('resize', ScaleToWindow);
    </script>
</body>

</html>
